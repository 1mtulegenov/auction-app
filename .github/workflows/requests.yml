name: Buyer access requests
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache/restore@v4
        with: { path: .req-sent, key: 'reqsent-${{ github.run_id }}', restore-keys: 'reqsent-' }
      - run: npm i --no-save --no-package-lock web-push@3.6.7 && node tools/reqnotify.mjs
        env:
          VAPID_PUBLIC: BDjW4mzPCyvLlkt6ptUxITcv7Z8Wt_YAyFBw7Ll-FE_FqH6CZlbQdPD65vhHZBW7Ttu1fxq0IdzSxgqHZsWu12A
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - if: hashFiles('req-changed') != ''
        uses: actions/cache/save@v4
        with: { path: .req-sent, key: 'reqsent-${{ github.run_id }}' }
