name: Auction starting soon
on:
  schedule:
    - cron: '*/15 12-23 * * 2-5'
  workflow_dispatch:
jobs:
  soon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: w
        run: echo "key=$(node tools/notify.mjs which)" >> "$GITHUB_OUTPUT"
      - if: steps.w.outputs.key != ''
        id: c
        uses: actions/cache/restore@v4
        with: { path: .soon-sent, key: 'soon-${{ steps.w.outputs.key }}', lookup-only: true }
      - if: steps.w.outputs.key != '' && steps.c.outputs.cache-hit != 'true'
        run: npm i --no-save --no-package-lock web-push@3.6.7 && node tools/notify.mjs && mkdir -p .soon-sent && date > .soon-sent/at
        env:
          MODE: soon
          VAPID_PUBLIC: BDjW4mzPCyvLlkt6ptUxITcv7Z8Wt_YAyFBw7Ll-FE_FqH6CZlbQdPD65vhHZBW7Ttu1fxq0IdzSxgqHZsWu12A
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - if: steps.w.outputs.key != '' && steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: .soon-sent, key: 'soon-${{ steps.w.outputs.key }}' }
