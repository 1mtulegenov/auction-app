name: Push notifications
on:
  push:
    branches: [main]
    paths: [data/index.json]
  workflow_dispatch:
    inputs:
      title: { description: 'Заголовок', required: true }
      body: { description: 'Текст', required: false }
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-package-lock web-push@3.6.7
      - run: node tools/notify.mjs
        env:
          VAPID_PUBLIC: BDjW4mzPCyvLlkt6ptUxITcv7Z8Wt_YAyFBw7Ll-FE_FqH6CZlbQdPD65vhHZBW7Ttu1fxq0IdzSxgqHZsWu12A
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TITLE: ${{ github.event.inputs.title }}
          BODY: ${{ github.event.inputs.body }}
